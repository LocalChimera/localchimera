[profile.default]
src = "contracts"
out = "out"
libs = ["lib", "upstream"]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "fhevm/=lib/fhevm/",
  "encrypted-types/=lib/encrypted-types/"
]
via_ir = true
optimizer = true
optimizer_runs = 200

# Robinhood Chain RPC
[rpc_endpoints]
chimera = "${CHIMERA_RPC_URL}"
robinhood = "https://rpc.mainnet.chain.robinhood.com"
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"

[etherscan]
chimera = { key = "", url = "" }
robinhood = { key = "", url = "https://robinhoodchain.blockscout.com" }
