name = "chimera-coordinator"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
account_id = "6c0140469651854b2e358517371a03d3"

routes = [
  { pattern = "coordinator.widespread.fyi", custom_domain = true }
]

[vars]
# Base mainnet; override to https://sepolia.base.org while testing.
BASE_RPC_URL = "https://mainnet.base.org"
# Set after DeployVolunteerEscrow.s.sol — the ERC1967Proxy address.
ESCROW_CONTRACT = "0x0000000000000000000000000000000000000000"
# Public sentinel — volunteers are an open pool; this token is only a
# handshake marker, not a secret (abuse control lives in per-IP limits).
VOLUNTEER_TOKEN = "widespread-volunteer"
POLL_INTERVAL_MS = "15000"
JOB_RESULT_TIMEOUT_MS = "60000"
MAX_PAYLOAD_BYTES = "8192"
MAX_VOLUNTEERS = "5000"

[[durable_objects.bindings]]
name = "COORDINATOR"
class_name = "CoordinatorDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CoordinatorDO"]

# [secrets] — set via `wrangler secret put`:
#   COORDINATOR_PRIVATE_KEY — task key; COORDINATOR_ROLE on the escrow
#     contract, funded with a little Base ETH for gas. Never receives
#     payments (escrow releases to SETTLEMENT_ADDRESS baked into the contract).
#   DISPATCH_AUTH_TOKEN    — authenticates POST /jobs + /jobs/batch +
#     /v1/chat/completions + /patronage (any project/site)
#   PROJECT_TOKENS         — JSON {"<slug>": "<token>"}: per-project dispatch tokens;
#     a project token may only submit jobs for its own slug
#   ADMIN_TOKEN            — authenticates POST /settle + /pools/unpause + GET /audit
#   SEALED_VALUES          — JSON {"<name>": "<secret>"}: redacted from payloads pre-dispatch
#   REP_WEBHOOK_URL        — optional rep-event webhook (delta-git bridge)
#
# [vars] (non-secret, set inline above if desired):
#   PRICE_TABLE            — JSON {"<taskType>": "<microUSDC>"} default job prices
#   PROJECT_BUDGETS        — JSON {"<slug>": "<wei>"} pool spend caps (breach → pause)
#   ANON_CAP_WEI           — anonymous (no-DID) lifetime payout cap; excess → rep
#   MIN_PAYOUT_WEI         — dust→rep conversion threshold at /settle
#   REFERRAL_JOB_CAP       — referral rep cap per referred node (default 50)
#   BASE_RPC_URLS          — comma-separated RPC failover list
#   CANARY_INTERVAL_MS     — honesty-canary cadence (default 1800000)
#   SHARD_KEY              — DO shard name (default 'global')
#   LANE_PREMIUMS          — JSON {"<domain>": <multiplier×100>} on PRICE_TABLE
#   AGENT_DAILY_QUOTA      — per-identity daily job cap (unset = unlimited)
#   POW_DIFFICULTY         — hashcash leading-zeros required on /jobs (0 = off)
#   X402_PAYEE             — payee address; enables 402 challenge on unpaid jobs
#   X402_USDC              — USDC contract (default Base USDC)
#   JURY_QUORUM            — siblings needed before group adjudication (default 3)
#   ENS_RPC                — mainnet RPC for /.well-known/ens content-hash lookup
#   PENDING_TTL_MS         — undispatchable-job expiry (default 3600000)
#   VERIFY_RATE_PCT        — % of pin jobs spot-checked on a second node (0 = off)
#   REFERRAL_TARGET        — landing URL for /r/<volunteerId> referral redirects
